<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTEROIDS — Classic Arcade Clone</title>
<!-- X.com player card: playable in-post embed -->
<meta name="twitter:card" content="player">

<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
  }
  /* Cabinet face: generated bezel (dark plastic, ASTEROIDS logotype,
     coin doors) with a TRANSPARENT screen window. */
  #bezel { position: relative; line-height: 0; }
  #bezel::before {
    content: "";
    display: block;
    width: 100%;
    padding-top: 100%; /* bezel.png is 1024x1024 */
  }
  /* The screen window = the transparent hole in bezel.png
     (measured: left 112/1024, top 212/1024, 800x600) */
  #screen {
    position: absolute;
    left: 10.9375%; top: 20.7031%;
    width: 78.125%; height: 58.5938%;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    width: 100%; height: 100%;
    position: absolute;
    top: 0; left: 0;
  }
  /* CRT shader layer overlays the game canvas; it is smooth, not pixelated,
     and never intercepts input */
  #fx { image-rendering: auto; pointer-events: none; }
  /* Bezel art sits on top of the screen; its transparent hole shows the game */
  #panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; color: #556; font-size: 12px;
  }
</style>
</head>
<body>
<div id="bezel">
  <div id="screen">
    <canvas id="game" width="580" height="435"></canvas>
    <canvas id="fx" width="580" height="435"></canvas>
  </div>
  <img id="panel" src="bezel.webp" alt="" onerror="this.onerror=null;this.src='bezel.png'">
</div>
<div id="hint">&larr;/&rarr; or A/D rotate &middot; &uarr;/W thrust &middot; Space fire &middot; N hyperspace &middot; tap to start &middot; P pause &middot; M mute &middot; C CRT: <span id="crtlabel">Glass</span></div>
<script>
"use strict";
// ============================================================
// ASTEROIDS CLONE — single-file, vanilla JS + canvas
// Classic 1979 Atari vector Asteroids (single player), full-screen.
// CRT effects (barrel distortion + scanlines) from LANDER/PONG.
// ============================================================

const W = 580, H = 435;
const DPR = 2; // internal supersample so vector lines stay crisp when upscaled
const cv = document.getElementById("game");
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext("2d");
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

// Scale the cabinet to fill the viewport (vector game + CRT shader, so
// upscaling is fine). 2% margin from the window edges.
const PANEL_W = 1024, PANEL_H = 1024; // bezel.png
const bezel = document.getElementById("bezel");
function fitCanvas() {
  const scale = Math.min(window.innerWidth / PANEL_W, window.innerHeight / PANEL_H) * 0.98;
  bezel.style.width = Math.max(240, Math.floor(PANEL_W * scale)) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ---------------- Constants ----------------
const SHIP_R = 10;             // collision radius
const SHIP_TURN = 4.2;         // rad/s
const SHIP_THRUST = 250;       // px/s^2
const SHIP_MAX_V = 260;        // px/s
const SHIP_DRAG = 0.4;         // per-second exponential drag
const BULLET_SPEED = 430;
const BULLET_LIFE = 1.05;      // s
const MAX_BULLETS = 4;         // on screen at once (original rule)
const HYPER_COOLDOWN = 1.2;    // s
const HYPER_DEATH_CHANCE = 0.15;

const ASTRO = {
  3: { r: 28, score: 20,  speed: [55, 95]  },  // large
  2: { r: 17, score: 50,  speed: [85, 145] },  // medium
  1: { r: 10, score: 100, speed: [125, 205] }, // small
};

const START_LIVES = 3;
const EXTRA_LIFE_SCORE = 10000;
const RESPAWN_INVULN = 2.0;    // s of blinking, no collision
const HISCORE_KEY = "asteroids.hiscore";

// ---------------- Game State ----------------
let state = "attract"; // attract | play | dead | gameover | paused
let stateTimer = 0;
let score = 0, hiScore = 0, lives = START_LIVES, nextExtra = EXTRA_LIFE_SCORE;
let wave = 1;
let muted = false;
let lastTime = performance.now();

try { hiScore = parseInt(localStorage.getItem(HISCORE_KEY) || "0", 10) || 0; } catch (e) {}

// Entities
let ship = null;
let bullets = [];
let asteroids = [];
let ufos = [];
let particles = [];   // debris lines
let popups = [];      // score text at destruction point
let hyperspaceReady = true;

function makeShip() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, rot: -Math.PI / 2, invuln: RESPAWN_INVULN };
}

function rand(a, b) { return a + Math.random() * (b - a); }

function makeAsteroid(size, x, y, speedScale = 1) {
  const spec = ASTRO[size];
  const ang = rand(0, Math.PI * 2);
  const sp = rand(spec.speed[0], spec.speed[1]) * speedScale;
  const n = 8 + Math.floor(Math.random() * 4);
  const verts = [];
  for (let i = 0; i < n; i++) verts.push(rand(0.72, 1.18));
  return { x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, size, verts, n };
}

function spawnWave(w) {
  const count = Math.min(3 + w, 8); // 4,5,6,7,8...
  const speedScale = 1 + Math.max(0, (w - 5)) * 0.08;
  for (let i = 0; i < count; i++) {
    // spawn away from the ship
    let x, y, tries = 0;
    do {
      x = rand(0, W); y = rand(0, H); tries++;
    } while (ship && Math.hypot(x - ship.x, y - ship.y) < 110 && tries < 40);
    asteroids.push(makeAsteroid(3, x, y, speedScale));
  }
}

// ---------------- Attract-mode background rocks ----------------
let attractRocks = [];
for (let i = 0; i < 5; i++) {
  const s = 1 + (i % 3);
  attractRocks.push(makeAsteroid(s, rand(0, W), rand(0, H), 0.7));
}

// ---------------- Wrapping ----------------
function wrap(o) {
  if (o.x < -o.r) o.x += W + o.r * 2;
  else if (o.x > W + o.r) o.x -= W + o.r * 2;
  if (o.y < -o.r) o.y += H + o.r * 2;
  else if (o.y > H + o.r) o.y -= H + o.r * 2;
}

// ---------------- Input ----------------
const keys = {};
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  primeAudio();
  if (e.code === "KeyP") {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }
  if (e.code === "KeyM") { muted = !muted; if (muted) setEngine(false); }
  if (e.code === "KeyC") { setCRT((crtMode + 1) % 3); return; }
  if (e.code === "KeyN" && state === "play" && ship) doHyperspace();
  // one bullet per press (OS key-repeat ignored) — the 4-bullet cap + bullet
  // lifetime are the fire-rate limit, like the original
  if (e.code === "Space" && !e.repeat && state === "play") fireShip();
  if (state === "attract" || state === "gameover") startGame();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

// Touch: tap = start/fire, drag = steer (horizontal = rotate, up = thrust)
let touchState = null;
cv.addEventListener("pointerdown", (e) => {
  primeAudio();
  if (state === "attract" || state === "gameover") { startGame(); return; }
  if (state === "paused") { state = "play"; return; }
  touchState = { id: e.pointerId, x: e.clientX, y: e.clientY, fire: true, dx: 0, up: false };
});
cv.addEventListener("pointermove", (e) => {
  if (!touchState || e.pointerId !== touchState.id) return;
  touchState.dx = e.clientX - touchState.x;
  touchState.up = touchState.y - e.clientY > 24;
});
cv.addEventListener("pointerup", (e) => {
  if (touchState && e.pointerId === touchState.id) {
    if (Math.hypot(touchState.dx, touchState.y - e.clientY) < 10) fireShip(); // tap = fire
    touchState = null;
  }
});

// ---------------- Game Flow ----------------
function startGame() {
  score = 0; lives = START_LIVES; nextExtra = EXTRA_LIFE_SCORE;
  wave = 1; bullets = []; asteroids = []; ufos = []; particles = []; popups = [];
  ship = makeShip();
  spawnWave(wave);
  ufoTimer = rand(9, 14);
  state = "play";
  setEngine(false);
}

function nextWave() {
  wave++;
  spawnWave(wave);
  ufoTimer = rand(8, 14);
}

function explodeAsteroid(a, x, y) {
  score += ASTRO[a.size].score;
  addPopup(x, y, ASTRO[a.size].score);
  debris(x, y, ASTRO[a.size].r, 0.5);
  sfx.explode(a.size);
  if (a.size > 1) {
    for (let i = 0; i < 2; i++) asteroids.push(makeAsteroid(a.size - 1, x, y));
  }
  if (score > hiScore) {
    hiScore = score;
    try { localStorage.setItem(HISCORE_KEY, String(hiScore)); } catch (e) {}
  }
  if (score >= nextExtra) {
    lives++; nextExtra += EXTRA_LIFE_SCORE;
    sfx.extraLife();
    addPopup(W / 2, H / 2 - 40, "EXTRA SHIP!");
  }
}

function killShip(force) {
  if (!ship || (!force && ship.invuln > 0)) return;
  debris(ship.x, ship.y, 20, 0.8);
  sfx.explode(3);
  setEngine(false);
  lives--;
  bullets = [];
  ship = null;
  if (lives <= 0) {
    state = "gameover";
  } else {
    state = "dead"; stateTimer = 1.6;
  }
}

function doHyperspace() {
  if (!ship || !hyperspaceReady) return;
  hyperspaceReady = false;
  hyperCooldownT = HYPER_COOLDOWN;
  const died = Math.random() < HYPER_DEATH_CHANCE; // roll before granting invuln
  ship.invuln = Math.max(ship.invuln, 0.5);
  ship.x = rand(30, W - 30); ship.y = rand(30, H - 30);
  ship.vx *= 0.3; ship.vy *= 0.3;
  debris(ship.x, ship.y, 18, 0.3);
  sfx.hyperspace();
  if (died) killShip(true);
}

// ---------------- Particles / popups ----------------
function debris(x, y, r, power) {
  const n = Math.max(6, Math.floor(r / 2.5));
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(20, 130) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.4, 0.9), len: rand(3, 9) });
  }
}
function addPopup(x, y, text) {
  popups.push({ x, y, text: String(text), life: 1.1 });
}

// ---------------- UFOs ----------------
let ufoTimer = 12;
function spawnUfo() {
  const small = wave >= 3 && Math.random() < Math.min(0.25 + (wave - 3) * 0.1, 0.6);
  const dir = Math.random() < 0.5 ? 1 : -1;
  const u = small
    ? { x: dir > 0 ? -20 : W + 20, y: rand(40, H - 40), vx: dir * rand(70, 100), vy: 0,
        small: true, r: 11, shootTimer: rand(0.5, 1.0), wobble: rand(0, 6) }
    : { x: dir > 0 ? -20 : W + 20, y: rand(40, H - 40), vx: dir * rand(45, 70), vy: 0,
        small: false, r: 16, shootTimer: rand(1.0, 1.8), wobble: rand(0, 6) };
  ufos.push(u);
}

// ---------------- Audio (Web Audio API — same approach as LANDER/PONG) ----------------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function primeAudio() {
  const a = audio();
  if (!a) return;
  if (a.state === "suspended") a.resume();
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    o.start(); o.stop(a.currentTime + 0.06);
  } catch (e) {}
  ensureEngine();
}
function beep(freq, dur, type, vol, slideTo) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, lowpass) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lowpass;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t);
}
// Thrust: filtered white-noise gas (same pattern as LANDER)
let engine = null;
function ensureEngine() {
  const a = audio(); if (!a || engine) return;
  try {
    const len = Math.floor(a.sampleRate * 2);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
    const g = a.createGain(); g.gain.value = 0;
    g.connect(a.destination);
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 300; bp.Q.value = 1.4;
    const hissG = a.createGain(); hissG.gain.value = 1.5;
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 120;
    const bodyG = a.createGain(); bodyG.gain.value = 0.7;
    src.connect(bp); bp.connect(hissG);
    src.connect(lp); lp.connect(bodyG); bodyG.connect(g);
    hissG.connect(g);
    src.start();
    engine = { g, vol: 0.22 };
  } catch (e) {}
}
function setEngine(on) {
  if (!engine) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const target = (on && !muted) ? engine.vol : 0.0001;
  engine.g.gain.cancelScheduledValues(t);
  engine.g.gain.setTargetAtTime(target, t, on ? 0.03 : 0.09);
}
// UFO siren: two-tone wail while a saucer is on screen
let sirenTimer = 0;
function sirenTick(dt) {
  if (!ufos.length || muted) return;
  sirenTimer -= dt;
  if (sirenTimer <= 0) {
    sirenTimer = 0.28;
    beep(ufos[0].small ? 988 : 660, 0.14, "square", 0.035, ufos[0].small ? 660 : 988);
  }
}
const sfx = {
  fire:     () => beep(880, 0.12, "square", 0.07, 220),
  explode:  (size) => { noiseBurst(0.3 + size * 0.12, 0.22, 900 - size * 200); beep(150 - size * 25, 0.3, "square", 0.09, 40); },
  ufoShot:  () => beep(520, 0.1, "sawtooth", 0.05, 180),
  extraLife:() => { beep(660, 0.1, "square", 0.08); setTimeout(() => beep(880, 0.1, "square", 0.08), 110); setTimeout(() => beep(1320, 0.16, "square", 0.08), 220); },
  hyperspace: () => beep(200, 0.25, "sawtooth", 0.08, 900),
};

// ---------------- Update ----------------
function fireShip() {
  if (state !== "play" || !ship || bullets.length >= MAX_BULLETS) return;
  const nx = Math.cos(ship.rot), ny = Math.sin(ship.rot);
  bullets.push({
    x: ship.x + nx * (SHIP_R + 4), y: ship.y + ny * (SHIP_R + 4),
    vx: ship.vx * 0.4 + nx * BULLET_SPEED, vy: ship.vy * 0.4 + ny * BULLET_SPEED,
    life: BULLET_LIFE, r: 2.5, ufo: false,
  });
  sfx.fire();
}

function update(dt) {
  sirenTick(dt);
  // popups + particles always animate
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].life -= dt; popups[i].y -= 14 * dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (state === "attract") {
    for (const a of attractRocks) { a.x += a.vx * dt; a.y += a.vy * dt; a.r = ASTRO[a.size].r; wrap(a); }
    return;
  }
  if (state !== "play" && state !== "dead") return;

  if (state === "dead") {
    stateTimer -= dt;
    if (stateTimer <= 0) { ship = makeShip(); state = "play"; }
  }

  // Ship
  if (ship && state === "play") {
    let turning = 0, thrusting = false;
    if (keys["ArrowLeft"] || keys["KeyA"]) turning -= 1;
    if (keys["ArrowRight"] || keys["KeyD"]) turning += 1;
    if (keys["ArrowUp"] || keys["KeyW"]) thrusting = true;
    if (touchState) {
      if (touchState.dx < -12) turning -= 1;
      if (touchState.dx > 12) turning += 1;
      if (touchState.up) thrusting = true;
    }
    ship.rot += turning * SHIP_TURN * dt;
    if (thrusting) {
      ship.vx += Math.cos(ship.rot) * SHIP_THRUST * dt;
      ship.vy += Math.sin(ship.rot) * SHIP_THRUST * dt;
    }
    const drag = Math.max(0, 1 - SHIP_DRAG * dt);
    ship.vx *= drag; ship.vy *= drag;
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > SHIP_MAX_V) { ship.vx *= SHIP_MAX_V / sp; ship.vy *= SHIP_MAX_V / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    ship.r = SHIP_R;
    wrap(ship);
    if (ship.invuln > 0) ship.invuln -= dt;
    ship.thrusting = thrusting;
    setEngine(thrusting);
  } else if (!ship) {
    setEngine(false);
  }

  // Hyperspace cooldown
  if (hyperCooldownT > 0) { hyperCooldownT -= dt; if (hyperCooldownT <= 0) hyperspaceReady = true; }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    wrap(b);
    if (b.life <= 0) bullets.splice(i, 1);
  }

  // Asteroids
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.r = ASTRO[a.size].r;
    wrap(a);
  }

  // UFOs
  if (state === "play") {
    ufoTimer -= dt;
    if (ufoTimer <= 0 && wave >= 2) { spawnUfo(); ufoTimer = rand(8, 15); }
  }
  for (let i = ufos.length - 1; i >= 0; i--) {
    const u = ufos[i];
    u.wobble += dt * 2.4;
    u.x += u.vx * dt;
    u.y += Math.sin(u.wobble) * 26 * dt;
    if (u.x < -40 || u.x > W + 40) { ufos.splice(i, 1); continue; }
    u.shootTimer -= dt;
    if (u.shootTimer <= 0 && ship) {
      u.shootTimer = u.small ? rand(0.9, 1.3) : rand(1.4, 2.0);
      let ang;
      if (u.small) {
        ang = Math.atan2(ship.y - u.y, ship.x - u.x) + rand(-0.25, 0.25);
      } else {
        ang = rand(0, Math.PI * 2);
      }
      bullets.push({
        x: u.x + Math.cos(ang) * (u.r + 3), y: u.y + Math.sin(ang) * (u.r + 3),
        vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260,
        life: 1.4, r: 2.5, ufo: true,
      });
      sfx.ufoShot();
    }
  }

  // Collisions: bullets vs asteroids / ufos
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let hit = false;
    if (!b.ufo) {
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (Math.hypot(b.x - a.x, b.y - a.y) < a.r + b.r) {
          explodeAsteroid(a, a.x, a.y);
          asteroids.splice(j, 1);
          hit = true;
          break;
        }
      }
      if (!hit) {
        for (let j = ufos.length - 1; j >= 0; j--) {
          const u = ufos[j];
          if (Math.hypot(b.x - u.x, b.y - u.y) < u.r + b.r + 3) {
            score += u.small ? 1000 : 200;
            addPopup(u.x, u.y, u.small ? 1000 : 200);
            debris(u.x, u.y, u.r + 4, 0.6);
            sfx.explode(2);
            ufos.splice(j, 1);
            hit = true;
            break;
          }
        }
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  // Ship vs asteroids / ufos / ufo bullets
  if (ship && ship.invuln <= 0 && state === "play") {
    let dead = false;
    for (const a of asteroids) {
      if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + SHIP_R * 0.9) { dead = true; break; }
    }
    if (!dead) {
      for (const u of ufos) {
        if (Math.hypot(ship.x - u.x, ship.y - u.y) < u.r + SHIP_R * 0.9) { dead = true; break; }
      }
    }
    if (!dead) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.ufo && Math.hypot(ship.x - b.x, ship.y - b.y) < b.r + SHIP_R * 0.9) {
          bullets.splice(i, 1); dead = true; break;
        }
      }
    }
    if (dead) killShip();
  }

  // Wave cleared
  if (state === "play" && asteroids.length === 0) {
    nextWave();
  }
}

// hyperspace cooldown bookkeeping
let hyperCooldownT = 0;

// ---------------- Drawing (vector style: white lines on black) ----------------
const INK = "rgba(235,240,250,1)";
const INK_DIM = "rgba(160,168,190,0.8)";

function drawShip(s) {
  // blink while invulnerable
  if (s.invuln > 0 && Math.floor(s.invuln * 10) % 2 === 0) return;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(-10, -8);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-10, 8);
  ctx.closePath();
  ctx.stroke();
  // thruster flame: rear corners converging to a tail point that flickers
  // between long and short, like the original vector render
  if (s.thrusting) {
    const f = (Math.floor(performance.now() / 40) % 2 === 0) ? 12 : 6;
    ctx.beginPath();
    ctx.moveTo(-10, -5);
    ctx.lineTo(-10 - f, 0);
    ctx.lineTo(-10, 5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i <= a.n; i++) {
    const f = a.verts[i % a.n];
    const ang = (i / a.n) * Math.PI * 2;
    const x = a.x + Math.cos(ang) * ASTRO[a.size].r * f;
    const y = a.y + Math.sin(ang) * ASTRO[a.size].r * f;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function drawUfo(u) {
  ctx.strokeStyle = u.small ? INK : INK_DIM;
  ctx.lineWidth = 1.5;
  const r = u.r;
  ctx.beginPath();
  ctx.ellipse(u.x, u.y, r, r * 0.38, 0, 0, Math.PI * 2); // hull
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(u.x, u.y - r * 0.32, r * 0.55, r * 0.4, 0, Math.PI, Math.PI * 2); // dome
  ctx.stroke();
  if (!u.small) {
    ctx.beginPath();
    ctx.moveTo(u.x - r * 0.7, u.y + r * 0.1);
    ctx.lineTo(u.x + r * 0.7, u.y + r * 0.1);
    ctx.stroke();
  }
}

function drawBullets() {
  ctx.fillStyle = INK;
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  ctx.strokeStyle = INK_DIM;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const p of particles) {
    const m = Math.hypot(p.vx, p.vy) || 1;
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (p.vx / m) * p.len * p.life * 1.5, p.y - (p.vy / m) * p.len * p.life * 1.5);
  }
  ctx.stroke();
}

function drawPopups() {
  ctx.font = "14px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = INK;
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawShipIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = INK_DIM;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.lineTo(-7, -6); ctx.lineTo(-4, 0); ctx.lineTo(-7, 6);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  ctx.font = "18px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = INK;
  ctx.fillText(String(score).padStart(4, "0"), 14, 26);
  ctx.textAlign = "center";
  ctx.fillStyle = INK_DIM;
  ctx.fillText("HI " + String(Math.max(hiScore, score)).padStart(4, "0"), W / 2, 26);
  ctx.textAlign = "right";
  ctx.fillText("WAVE " + wave, W - 14, 26);
  for (let i = 0; i < Math.max(0, lives - 1); i++) drawShipIcon(20 + i * 22, H - 18);
}

function centerText(text, y, font, color, tracking = 0) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  if (tracking > 0) {
    const widths = [...text].map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * (text.length - 1);
    let x = W / 2 - total / 2;
    ctx.textAlign = "left";
    [...text].forEach((c, i) => { ctx.fillText(c, x, y); x += widths[i] + tracking; });
  } else {
    ctx.fillText(text, W / 2, y);
  }
}

function drawAttract() {
  ctx.strokeStyle = INK;
  for (const a of attractRocks) drawAsteroid(a);
  centerText("ASTEROIDS", H / 2 - 30, "bold 44px 'Courier New', monospace", INK, 8);
  centerText("A  C L A S S I C   A R C A D E   C L O N E", H / 2 + 6, "13px 'Courier New', monospace", INK_DIM);
  if (Math.floor(performance.now() / 600) % 2 === 0) {
    centerText("PRESS ANY KEY OR TAP TO START", H / 2 + 52, "16px 'Courier New', monospace", INK);
  }
  centerText("HI " + String(hiScore).padStart(4, "0"), H - 24, "16px 'Courier New', monospace", INK_DIM);
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (state === "attract") { drawAttract(); return; }

  for (const a of asteroids) drawAsteroid(a);
  for (const u of ufos) drawUfo(u);
  drawBullets();
  drawParticles();
  if (ship) drawShip(ship);
  drawPopups();
  drawHUD();

  if (state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    centerText("GAME OVER", H / 2 - 20, "bold 36px 'Courier New', monospace", INK, 6);
    centerText("SCORE " + String(score).padStart(4, "0"), H / 2 + 14, "18px 'Courier New', monospace", INK_DIM);
    if (Math.floor(performance.now() / 600) % 2 === 0) {
      centerText("PRESS ANY KEY TO PLAY AGAIN", H / 2 + 56, "16px 'Courier New', monospace", INK);
    }
  } else if (state === "paused") {
    centerText("PAUSED", H / 2, "bold 30px 'Courier New', monospace", INK, 8);
  }
}

// ---------------- Main loop ----------------
function frame(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000);
  lastTime = t;
  if (state !== "paused") update(dt);
  draw();
  fxRender(t / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- CRT glass (WebGL shader layer — from LANDER/PONG) ----------------
// Game renders to 2D canvas, uploaded as a texture and drawn through a
// fragment shader (scanlines, barrel distortion / tube curvature, glass sheen).
let fx = document.getElementById("fx");
fx.width = W * DPR; fx.height = H * DPR; // 1:1 with the game canvas
const crtlabel = document.getElementById("crtlabel");
let fxGL = null;

function initFX() {
  const gl = fx.getContext("webgl", { alpha: false });
  if (!gl) return;
  const VS = [
    "attribute vec2 a_pos;",
    "varying vec2 vUv;",
    "void main() {",
    "  vUv = vec2(0.5 + a_pos.x * 0.5, 0.5 - a_pos.y * 0.5);",
    "  gl_Position = vec4(a_pos, 0.0, 1.0);",
    "}",
  ].join("\n");
  const FS = [
    "precision highp float;",
    "varying vec2 vUv;",
    "uniform sampler2D u_tex;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform int u_mode; // 0 pass-through, 1 arcade CRT, 2 glass TV",
    "vec3 glow8(sampler2D t, vec2 p, vec2 px) {",
    "  vec3 s = vec3(0.0);",
    "  s += texture2D(t, p + vec2( px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0,  px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -px.y)).rgb;",
    "  s += texture2D(t, p + vec2(2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, 2.0*px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -2.0*px.y)).rgb;",
    "  return s * 0.125;",
    "}",
    "void main() {",
    "  vec2 uv = vUv;",
    "  vec2 px = 1.0 / u_res;",
    "  vec2 c = uv - 0.5;",
    "  float r2 = dot(c, c);",
    "  vec3 col;",
    "  if (u_mode == 2) { // glass TV — barrel distortion + scanlines + vignette",
    "    vec2 suv = 0.5 + c * (1.0 + 0.18 * r2);",
    "    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) {",
    "      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;",
    "    }",
    "    col.r = texture2D(u_tex, suv + vec2(0.5, 0.4) * px).r + 0.02;",
    "    col.g = texture2D(u_tex, suv + vec2(0.0, -0.6) * px).g + 0.02;",
    "    col.b = texture2D(u_tex, suv + vec2(-0.9, 0.0) * px).b + 0.02;",
    "    col += (glow8(u_tex, suv, px) - col) * 0.30;",
    "    col = clamp(col * 1.3 + 0.75 * col * col + 1.25 * col * col * col * col * col, vec3(0.0), vec3(10.0));",
    "    float vig = 0.01 + 16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);",
    "    col *= 1.3 * sqrt(vig);",
    "    float scans = clamp(0.35 + 0.18 * sin(u_time * 6.0 - suv.y * u_res.y * 1.5), 0.0, 1.0);",
    "    col *= pow(scans, 0.9);",
    "    col *= 1.0 - 0.23 * clamp(mod(suv.x * u_res.x, 3.0) / 2.0, 0.0, 1.0);",
    "    vec3 fc = max(col, vec3(0.0));",
    "    col = (fc * (6.2 * fc + 0.5)) / (fc * (6.2 * fc + 1.7) + 0.06);",
    "    float d = uv.x * 0.65 + uv.y * 0.75;",
    "    float sheen = exp(-pow((d - 1.08) / 0.16, 2.0)) * 0.05;",
    "    sheen += exp(-pow(length(uv - vec2(0.16, 0.14)) / 0.30, 2.0)) * 0.035;",
    "    col += sheen;",
    "    // --- glass reflections (procedural, ShaderGlass-style) ---",
    "    float fres = clamp(0.10 + 1.8 * r2, 0.0, 1.0);",
    "    float bandPos = uv.x * 0.7 + uv.y * 0.55 - 0.25 - 0.05 * sin(u_time * 0.15);",
    "    float refBand = exp(-pow(bandPos / 0.20, 2.0));",
    "    float refEdge = exp(-pow((bandPos + 0.26) / 0.045, 2.0));",
    "    float refLight = exp(-pow(length(uv - vec2(0.16, 0.18)) / 0.34, 2.0));",
    "    vec3 refl = refBand * vec3(0.10, 0.115, 0.13);",
    "    refl += refEdge * vec3(0.055, 0.065, 0.075);",
    "    refl += refLight * vec3(0.09, 0.085, 0.075);",
    "    col += refl * (0.45 + 0.55 * fres);",
    "    col *= 1.0 + 0.008 * sin(u_time * 377.0);",
    "  } else if (u_mode == 1) { // arcade CRT: scanlines + grille + glow",
    "    col = texture2D(u_tex, uv).rgb;",
    "    float row = fract(uv.y * u_res.y * 0.5);",
    "    col *= 0.80 + 0.20 * cos(row * 6.28318);",
    "    col *= 0.95 + 0.05 * cos(fract(uv.x * u_res.x) * 3.14159);",
    "    col += (glow8(u_tex, uv, px) - col) * 0.40;",
    "    col = vec3(pow(max(col.r, 0.0), 0.625), pow(max(col.g, 0.0), 0.625), pow(max(col.b, 0.0), 0.625));",
    "    col *= 1.0 - 0.30 * smoothstep(0.18, 0.50, r2);",
    "  } else {",
    "    col = texture2D(u_tex, uv).rgb;",
    "  }",
    "  gl_FragColor = vec4(col, 1.0);",
    "}",
  ].join("\n");

  function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  const vs = makeShader(gl.VERTEX_SHADER, VS);
  const fs = makeShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p)); return;
  }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fxGL = {
    gl, p, tex,
    aPos: gl.getAttribLocation(p, "a_pos"),
    uTex: gl.getUniformLocation(p, "u_tex"),
    uRes: gl.getUniformLocation(p, "u_res"),
    uTime: gl.getUniformLocation(p, "u_time"),
    uMode: gl.getUniformLocation(p, "u_mode"),
  };
}

function setupFxEvents() {
  fx.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    fxGL = null;
    setCRT(0);
  });
  fx.addEventListener("webglcontextrestored", () => {
    initFX();
    setCRT(2);
  });
}

initFX();
setupFxEvents();

let crtMode = 2; // 0 off, 1 arcade, 2 glass
const CRT_NAMES = ["Off", "Arcade", "Glass"];
function setCRT(m) {
  crtMode = fxGL ? m : 0;
  fx.style.display = crtMode === 0 ? "none" : "block";
  if (crtlabel) crtlabel.textContent = fxGL ? CRT_NAMES[crtMode] : "No WebGL";
}
function fxRender(t) {
  const f = fxGL;
  if (!f || crtMode === 0 || f.gl.isContextLost()) return;
  const { gl, p, tex } = f;
  gl.viewport(0, 0, fx.width, fx.height);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.useProgram(p);
  gl.enableVertexAttribArray(f.aPos);
  gl.vertexAttribPointer(f.aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1i(f.uTex, 0);
  gl.uniform2f(f.uRes, W, H);
  gl.uniform1f(f.uTime, t);
  gl.uniform1i(f.uMode, crtMode);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
setCRT(2);
</script>
